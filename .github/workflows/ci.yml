name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: outlier
          POSTGRES_PASSWORD: outlier
          POSTGRES_DB: outlier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outlier -d outlier_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      UV_PROJECT_ENVIRONMENT: venv
      TEST_DATABASE_URL: postgresql+asyncpg://outlier:outlier@localhost:5432/outlier_test
      DATABASE_URL: postgresql+asyncpg://outlier:outlier@localhost:5432/outlier_test
      DRY_RUN: "true"
      STORAGE_BACKEND: local
      PII_HMAC_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not slow and not contract" -q --cov=packages --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: outlier
          POSTGRES_PASSWORD: outlier
          POSTGRES_DB: outlier
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U outlier -d outlier"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      UV_PROJECT_ENVIRONMENT: venv
      DATABASE_URL: postgresql+asyncpg://outlier:outlier@127.0.0.1:5433/outlier
      E2E_DATABASE_URL: postgresql+asyncpg://outlier:outlier@127.0.0.1:5433/outlier
      DRY_RUN: "true"
      STORAGE_BACKEND: local
      PII_HMAC_KEY: ci-only
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - run: cd packages/backend && uv run alembic upgrade head
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm exec playwright install --with-deps chromium
      - run: cd frontend && pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  # GPU-only: real trainer steps on a tiny model. Runs when a PR carries the `gpu` label.
  trainer-smoke:
    if: contains(github.event.pull_request.labels.*.name, 'gpu')
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --all-packages --extra train
      - run: |
          for stage in rft dpo grpo_offpolicy; do
            uv run --package outlier-trainer python -m outlier_trainer.run \
              --stage $stage --snapshot tests/fixtures/mini_snapshot.parquet \
              --out /tmp/oai-$stage --base-model Qwen/Qwen3-0.6B --smoke
          done
          uv run --package outlier-trainer python -m outlier_trainer.run \
            --stage grpo_onpolicy --snapshot tests/fixtures/mini_snapshot.parquet \
            --out /tmp/oai-onpolicy --base-model Qwen/Qwen3-0.6B --smoke --simulator
