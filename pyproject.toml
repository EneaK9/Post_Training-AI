[project]
name = "outlier-ai-workspace"
version = "0.1.0"
description = "Outlier AI: post-training system for outlier ad campaigns (workspace root)"
requires-python = ">=3.12,<3.14"
# The root depends on every member so `uv sync` / `uv run` keep them all installed.
dependencies = ["outlier-schemas", "outlier-ai", "outlier-trainer"]

# Root extras forward to member extras so one `uv sync --all-packages --extra <name>` keeps the
# whole workspace installed and adds the optional stack.
[project.optional-dependencies]
llm = ["outlier-ai[llm]"]        # Anthropic SDK for the API generator, judges, extraction
train = ["outlier-trainer[train]"]  # GPU stack for Loop B

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
outlier-schemas = { workspace = true }
outlier-ai = { workspace = true }
outlier-trainer = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6.110",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/schemas", "packages/backend", "packages/trainer", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012", "B008", "N805", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF018", "E501"]
"packages/backend/alembic/versions/*" = ["E501", "N999"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = "venv"
include = ["packages", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "packages/backend/alembic/versions"]
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "integration: requires Postgres (docker compose up)",
  "slow: simulator experiments and trainer smoke runs",
  "contract: recorded external API fixtures",
]
filterwarnings = ["error::DeprecationWarning:outlier_ai.*"]
