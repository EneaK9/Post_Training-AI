[project]
name = "outlier-ai"
version = "0.1.0"
description = "Outlier AI backend: Loop A search, evaluator integration, API, jobs"
requires-python = ">=3.12,<3.14"
dependencies = [
  "outlier-schemas",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "rich>=13.8",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "cryptography>=43",
  "boto3>=1.35",
  "jinja2>=3.1",
  "pillow>=10.4",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "argon2-cffi>=23",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy or phase-specific extras, installed only where needed.
ml = ["sentence-transformers>=3.0"]
llm = ["anthropic>=1.0"]
meta = ["facebook-business>=21"]
signals = ["presidio-analyzer>=2.2.360"]

[project.scripts]
oai = "outlier_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outlier_ai"]
