[project]
name = "outlier-trainer"
version = "0.1.0"
description = "Outlier AI Loop B trainer: RFT, DPO, off-policy GRPO, on-policy GRPO (simulator only)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "outlier-schemas",
  "numpy>=2.0",
  "pyarrow>=17",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# GPU stack. Install on the training box only: `uv sync --all-packages --extra train`.
train = [
  "torch>=2.4",
  "transformers>=4.45",
  "trl>=1.12",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outlier_trainer"]
