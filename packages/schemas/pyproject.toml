[project]
name = "outlier-schemas"
version = "0.1.0"
description = "Shared pydantic models, enums, and typed config for Outlier AI (no IO)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outlier_schemas"]
